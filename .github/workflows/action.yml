name: Automatic Tile Generation and Release - Germany + Benelux + France + Italy + Spain + Austria + Switzerland

permissions:
  contents: write

on:
  schedule:
    - cron: '30 0 1 * *'  # Monthly on the 1st at 00:30 UTC
  workflow_dispatch:
    inputs:
      regions:
        description: "all or comma-separated region IDs (e.g. alsace,islas-baleares,graz,vienna,zurich)"
        required: true
        type: string
        default: all

jobs:
  select_regions:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.choose.outputs.regions }}
      count: ${{ steps.choose.outputs.count }}
      needs_austria: ${{ steps.choose.outputs.needs_austria }}
      needs_switzerland: ${{ steps.choose.outputs.needs_switzerland }}
    steps:
      - uses: actions/checkout@v4
      - name: Select regions for this run
        id: choose
        env:
          REGION_SET: ${{ inputs.regions || 'all' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          with open('.github/regions.json') as f:
              regions = json.load(f)
          selection = os.environ['REGION_SET'].strip()
          if selection != 'all':
              names = [name.strip() for name in selection.split(',')]
              available = {region['name']: region for region in regions}
              if not names or any(name not in available for name in names):
                  raise SystemExit(f'Unknown or empty region in: {selection}')
              if len(names) != len(set(names)):
                  raise SystemExit(f'Duplicate region in: {selection}')
              regions = [available[name] for name in names]
          print('regions=' + json.dumps(regions, separators=(',', ':')))
          print('count=' + str(len(regions)))
          print('needs_austria=' + str(any(r['name'] in ('graz', 'vienna') for r in regions)).lower())
          print('needs_switzerland=' + str(any(r['name'] == 'zurich' for r in regions)).lower())
          PY

  prepare_austria:
    needs: select_regions
    if: needs.select_regions.outputs.needs_austria == 'true'
    runs-on: self-hosted
    steps:
      - name: Clip Graz and Vienna from Geofabrik Austria
        run: |
          set -euo pipefail
          command -v osmium >/dev/null || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          work="${{ runner.temp }}/valhalla-austria-${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$work"
          test "$(df -Pk "$work" | awk 'NR==2 {print $4}')" -ge 3145728 || { echo 'Need 3 GB free to prepare Austrian city extracts' >&2; exit 1; }
          wget -q -O "$work/austria.osm.pbf" https://download.geofabrik.de/europe/austria-latest.osm.pbf
          osmium extract -s smart -S types=multipolygon,boundary \
            -b 15.15,46.90,15.70,47.25 \
            -o "$work/graz.osm.pbf" "$work/austria.osm.pbf"
          osmium extract -s smart -S types=multipolygon,boundary \
            -b 16.05,48.03,16.72,48.42 \
            -o "$work/vienna.osm.pbf" "$work/austria.osm.pbf"
          rm "$work/austria.osm.pbf"
          test -s "$work/graz.osm.pbf" && test -s "$work/vienna.osm.pbf"
          ls -lh "$work"/*.osm.pbf

      - name: Upload Austrian city extracts
        uses: actions/upload-artifact@v7
        with:
          name: austrian-city-pbfs
          path: ${{ runner.temp }}/valhalla-austria-${{ github.run_id }}-${{ github.run_attempt }}/*.osm.pbf
          compression-level: 0
          if-no-files-found: error

      - name: Clean up Austrian extracts
        if: always()
        run: rm -rf "${{ runner.temp }}/valhalla-austria-${{ github.run_id }}-${{ github.run_attempt }}"

  # Matrix of regional builds. Each job:
  #   1. Checks out the repo to pick up admin-overlays/west-europe.osm.pbf
  #   2. Downloads its regional Geofabrik PBF
  #   3. Builds admins from (overlay + regional PBF) so Valhalla has the L2
  #      country relation it needs for drive_on_right (regional extracts are
  #      clipped to the region polygon and don't carry the country relation).
  #   4. Builds tiles, applies OpenStreetMapSpeeds defaults, packages.
  #
  # The overlay carries L2 polygons for DE/FR/NL/BE/LU/IT/ES/AT with the
  # right ISO3166-1 codes. See tools/build-admin-overlay.py to regenerate.
  # This replaces the previous pattern of downloading germany-latest.osm.pbf
  # (5 GB) in a separate generate_admins job and sharing via artifact.
  prepare_switzerland:
    needs: select_regions
    if: needs.select_regions.outputs.needs_switzerland == 'true'
    runs-on: self-hosted
    steps:
      - name: Clip canton Zürich from Geofabrik Switzerland
        run: |
          set -euo pipefail
          command -v osmium >/dev/null || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          work="${{ runner.temp }}/valhalla-switzerland-${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$work"
          test "$(df -Pk "$work" | awk 'NR==2 {print $4}')" -ge 3145728 || { echo 'Need 3 GB free to prepare the Zürich extract' >&2; exit 1; }
          wget -q -O "$work/switzerland.osm.pbf" https://download.geofabrik.de/europe/switzerland-latest.osm.pbf
          osmium extract -s smart -S types=multipolygon,boundary \
            -b 8.08,46.97,9.27,47.88 \
            -o "$work/zurich.osm.pbf" "$work/switzerland.osm.pbf"
          rm "$work/switzerland.osm.pbf"
          test -s "$work/zurich.osm.pbf"
          ls -lh "$work/zurich.osm.pbf"

      - name: Upload Zürich extract
        uses: actions/upload-artifact@v7
        with:
          name: swiss-canton-pbf
          path: ${{ runner.temp }}/valhalla-switzerland-${{ github.run_id }}-${{ github.run_attempt }}/zurich.osm.pbf
          compression-level: 0
          if-no-files-found: error

      - name: Clean up Swiss extract
        if: always()
        run: rm -rf "${{ runner.temp }}/valhalla-switzerland-${{ github.run_id }}-${{ github.run_attempt }}"

  generate_tiles:
    needs: [select_regions, prepare_austria, prepare_switzerland]
    if: >-
      always() && needs.select_regions.result == 'success' &&
      (needs.prepare_austria.result == 'success' || (needs.prepare_austria.result == 'skipped' && needs.select_regions.outputs.needs_austria == 'false')) &&
      (needs.prepare_switzerland.result == 'success' || (needs.prepare_switzerland.result == 'skipped' && needs.select_regions.outputs.needs_switzerland == 'false'))
    runs-on: self-hosted
    container:
        image: ghcr.io/valhalla/valhalla:3.6.3
        options: --privileged --cgroupns host --user root
    strategy:
      fail-fast: false
      matrix:
        # Brandenburg covers Berlin; passing both extracts creates duplicate edges.
        region: ${{ fromJSON(needs.select_regions.outputs.regions) }}
    steps:

    - name: Checkout repository (for admin overlay)
      uses: actions/checkout@v4

    - name: Download Dependencies
      run: apt install wget -y

    - name: Download Austrian city extract
      if: matrix.region.name == 'graz' || matrix.region.name == 'vienna'
      uses: actions/download-artifact@v8
      with:
        name: austrian-city-pbfs
        path: austrian-city-pbfs

    - name: Stage Austrian city PBF
      if: matrix.region.name == 'graz' || matrix.region.name == 'vienna'
      run: |
        cp austrian-city-pbfs/${{ matrix.region.name }}.osm.pbf ${{ matrix.region.name }}.osm.pbf
        test -s ${{ matrix.region.name }}.osm.pbf

    - name: Download Zürich extract
      if: matrix.region.name == 'zurich'
      uses: actions/download-artifact@v8
      with:
        name: swiss-canton-pbf
        path: swiss-canton-pbf

    - name: Stage Zürich PBF
      if: matrix.region.name == 'zurich'
      run: |
        cp swiss-canton-pbf/zurich.osm.pbf zurich.osm.pbf
        test -s zurich.osm.pbf

    - name: Download OSM PBF for ${{ matrix.region.name }}
      if: matrix.region.name != 'graz' && matrix.region.name != 'vienna' && matrix.region.name != 'zurich'
      run: |
        echo "Downloading ${{ matrix.region.name }} PBF file..."
        pbf=$(basename "${{ matrix.region.url }}")
        wget -q -O "$pbf" "${{ matrix.region.url }}"
        echo "Download completed for ${{ matrix.region.name }}"
        ls -la *.osm.pbf

    - name: Fetch community default_speeds.json
      run: wget -q https://raw.githubusercontent.com/OpenStreetMapSpeeds/schema/master/default_speeds.json

    - name: Mjolnir Build for ${{ matrix.region.name }}
      run: |
        echo "Building Valhalla configuration for ${{ matrix.region.name }}..."
        valhalla_build_config \
          --mjolnir-include-bicycle false \
          --mjolnir-include-pedestrian false \
          --mjolnir-default-speeds-config $(pwd)/default_speeds.json \
          | tee valhalla.json

        # Bake a per-node timezone so date_time routing can evaluate
        # time-conditional restrictions. Each regional extract is a single IANA
        # zone, so a one-polygon tz_world covering West Europe (tagged with this
        # region's zone) is enough — no need for the full timezone-boundary DB.
        case "${{ matrix.region.name }}" in
          netherlands)   TZID="Europe/Amsterdam" ;;
          belgium)       TZID="Europe/Brussels" ;;
          luxembourg)    TZID="Europe/Luxembourg" ;;
          ile-de-france|alsace) TZID="Europe/Paris" ;;
          islas-baleares) TZID="Europe/Madrid" ;;
          graz|vienna)   TZID="Europe/Vienna" ;;
          zurich)        TZID="Europe/Zurich" ;;
          italy-*)       TZID="Europe/Rome" ;;
          *)             TZID="Europe/Berlin" ;;
        esac
        echo "Timezone for ${{ matrix.region.name }}: $TZID"
        tz_sqlite="$(pwd)/timezones.sqlite"
        rm -f "$tz_sqlite"
        spatialite "$tz_sqlite" "CREATE TABLE tz_world (id INTEGER PRIMARY KEY AUTOINCREMENT, TZID TEXT);
        SELECT AddGeometryColumn('tz_world','geom',4326,'MULTIPOLYGON',2);
        INSERT INTO tz_world (TZID, geom) VALUES ('$TZID', CastToMulti(GeomFromText('POLYGON((-12 34,-12 60,30 60,30 34,-12 34))',4326)));
        SELECT CreateSpatialIndex('tz_world','geom');"
        test "$(spatialite "$tz_sqlite" 'SELECT count(*) FROM tz_world;')" = "1" || { echo "ERROR: tz overlay build failed"; exit 1; }
        python3 -c "import json; c=json.load(open('valhalla.json')); c['mjolnir']['timezone']='$tz_sqlite'; json.dump(c, open('valhalla.json','w'), indent=2)"
        grep -q '"timezone": ".*timezones.sqlite"' valhalla.json || { echo "ERROR: timezone not injected into config"; exit 1; }

        # Classify sett and cobblestone as their own surface so the scooter
        # costing can weigh them. Valhalla lumps sett and paving stones in with
        # asphalt, which makes Kopfsteinpflaster invisible to routing. Our
        # overlay wraps ways_proc rather than patching it, so a Valhalla bump
        # only needs a fresh graph.lua here, not a rebased diff.
        wget -q -O upstream-graph.lua \
          https://raw.githubusercontent.com/valhalla/valhalla/3.6.3/lua/graph.lua
        cat upstream-graph.lua lua/librescoot-surface.lua > graph-librescoot.lua
        graph_lua="$(pwd)/graph-librescoot.lua"
        python3 -c "import json; c=json.load(open('valhalla.json')); c['mjolnir']['graph_lua_name']='$graph_lua'; json.dump(c, open('valhalla.json','w'), indent=2)"
        grep -q '"graph_lua_name": ".*graph-librescoot.lua"' valhalla.json || { echo "ERROR: graph lua not injected into config"; exit 1; }

        pbf=$(basename "${{ matrix.region.url }}")
        case "${{ matrix.region.name }}" in graz|vienna|zurich) pbf="${{ matrix.region.name }}.osm.pbf" ;; esac
        mkdir -p /data/valhalla

        echo "Building admin DB from overlay + regional PBF..."
        valhalla_build_admins -c valhalla.json \
          admin-overlays/west-europe.osm.pbf \
          "$pbf"

        echo "Building tiles for ${{ matrix.region.name }}..."
        valhalla_build_tiles -c valhalla.json "$pbf"

        echo "Applying OpenStreetMapSpeeds default speeds to tiles..."
        valhalla_assign_speeds -c valhalla.json

        echo "Building extract for ${{ matrix.region.name }}..."
        valhalla_build_extract -c valhalla.json

        echo "Creating tarball for ${{ matrix.region.name }}..."
        mv /data/valhalla/tiles.tar /data/valhalla/valhalla_tiles_${{ matrix.region.name }}.tar

        echo "Tile generation completed for ${{ matrix.region.name }}"
        ls -la /data/valhalla/

    - name: Copy and Fix Permissions for ${{ matrix.region.name }}
      run: |
        mkdir -p /tmp/artifacts
        cp /data/valhalla/valhalla_tiles_${{ matrix.region.name }}.tar /tmp/artifacts/
        chown $(whoami):$(whoami) /tmp/artifacts/valhalla_tiles_${{ matrix.region.name }}.tar
        chmod 666 /tmp/artifacts/valhalla_tiles_${{ matrix.region.name }}.tar
        ls -la /tmp/artifacts/

    - name: Compress tiles for ${{ matrix.region.name }}
      run: |
        command -v zstd >/dev/null 2>&1 || { apt-get update && apt-get install -y zstd; }
        # Level 19 without --long: the DBC decoder window stays at 8 MB, which
        # matters on a 1 GB board, and --long buys ~0.1 MB for twice the time.
        zstd -19 -T0 -q --force \
          -o /tmp/artifacts/valhalla_tiles_${{ matrix.region.name }}.tar.zst \
          /tmp/artifacts/valhalla_tiles_${{ matrix.region.name }}.tar
        chmod 666 /tmp/artifacts/valhalla_tiles_${{ matrix.region.name }}.tar.zst
        ls -la /tmp/artifacts/

    - name: Upload Build Artifact for ${{ matrix.region.name }}
      uses: actions/upload-artifact@v7
      with:
        name: valhalla_tiles_${{ matrix.region.name }}
        path: |
          /tmp/artifacts/valhalla_tiles_${{ matrix.region.name }}.tar
          /tmp/artifacts/valhalla_tiles_${{ matrix.region.name }}.tar.zst

    - name: Free runner disk space
      if: always()
      run: |
        pbf=$(basename "${{ matrix.region.url }}")
        case "${{ matrix.region.name }}" in graz|vienna|zurich) pbf="${{ matrix.region.name }}.osm.pbf" ;; esac
        rm -f "$pbf" /tmp/artifacts/valhalla_tiles_${{ matrix.region.name }}.tar \
          /tmp/artifacts/valhalla_tiles_${{ matrix.region.name }}.tar.zst \
          /data/valhalla/valhalla_tiles_${{ matrix.region.name }}.tar
        rm -rf austrian-city-pbfs swiss-canton-pbf

  release:
    needs: [select_regions, generate_tiles]
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main' && needs.generate_tiles.result == 'success'
    steps:
      - name: Download tile artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: valhalla_tiles_*

      - name: List All Artifacts
        run: |
          echo "Listing all downloaded artifacts:"
          find artifacts \( -name "*.tar" -o -name "*.tar.zst" \) -type f

      - name: Name the release
        id: publish
        run: |
          set -euo pipefail
          tag="tiles-$(date -u +%Y%m%dT%H%M%SZ)"
          count=$(find artifacts -name '*.tar' -type f | wc -l)
          if [ "$count" -ne "${{ needs.select_regions.outputs.count }}" ]; then
            echo "expected ${{ needs.select_regions.outputs.count }} routing archives, got $count" >&2
            exit 1
          fi
          compressed=$(find artifacts -name '*.tar.zst' -type f | wc -l)
          test "$compressed" -eq "$count"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create Automatic Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.publish.outputs.tag }}
          name: "Valhalla Tiles - ${{ steps.publish.outputs.tag }}"
          prerelease: false
          files: |
            artifacts/**/*.tar
            artifacts/**/*.tar.zst
          fail_on_unmatched_files: true

      # Enable after the downloads site serves the per-region index.
      - name: Generate app token for downloads rebuild
        if: vars.MAPS_INDEX_READY == 'true'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: librescoot
          repositories: downloads.librescoot.org

      - name: Trigger downloads site rebuild
        if: vars.MAPS_INDEX_READY == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: librescoot/downloads.librescoot.org
          event-type: releases-changed
