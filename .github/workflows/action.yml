name: Automatic Tile Generation and Release - Germany + Benelux + France + Italy

permissions:
  contents: write

on:
  schedule:
    - cron: '30 0 1 * *'  # Monthly on the 1st at 00:30 UTC
  workflow_dispatch:

jobs:
  # Single matrix of all regional builds. Each job:
  #   1. Checks out the repo to pick up admin-overlays/west-europe.osm.pbf
  #   2. Downloads its regional Geofabrik PBF
  #   3. Builds admins from (overlay + regional PBF) so Valhalla has the L2
  #      country relation it needs for drive_on_right (regional extracts are
  #      clipped to the region polygon and don't carry the country relation).
  #   4. Builds tiles, applies OpenStreetMapSpeeds defaults, packages.
  #
  # The overlay carries hand-built L2 polygons for DE/FR/NL/BE/LU with the
  # right ISO3166-1 codes. See tools/build-admin-overlay.py to regenerate.
  # This replaces the previous pattern of downloading germany-latest.osm.pbf
  # (5 GB) in a separate generate_admins job and sharing via artifact.
  generate_tiles:
    runs-on: self-hosted
    container:
        image: ghcr.io/valhalla/valhalla:3.6.3
        options: --privileged --cgroupns host --user root
    strategy:
      fail-fast: false
      matrix:
        region:
          - { name: "baden-wuerttemberg", url: "https://download.geofabrik.de/europe/germany/baden-wuerttemberg-latest.osm.pbf" }
          - { name: "bayern", url: "https://download.geofabrik.de/europe/germany/bayern-latest.osm.pbf" }
          # Berlin's Geofabrik extract is fully contained in Brandenburg's
          # (Brandenburg surrounds Berlin geographically and Geofabrik's
          # padded bbox makes the two extracts produce identical node/way/
          # relation sets for Berlin). Feeding both to valhalla_build_tiles
          # creates duplicate edges for every Berlin way, exploding maneuver
          # counts at route time. So we use just the Brandenburg PBF but
          # label the output `berlin_brandenburg` to reflect coverage.
          - { name: "berlin_brandenburg", url: "https://download.geofabrik.de/europe/germany/brandenburg-latest.osm.pbf" }
          - { name: "bremen", url: "https://download.geofabrik.de/europe/germany/bremen-latest.osm.pbf" }
          - { name: "hamburg", url: "https://download.geofabrik.de/europe/germany/hamburg-latest.osm.pbf" }
          - { name: "hessen", url: "https://download.geofabrik.de/europe/germany/hessen-latest.osm.pbf" }
          - { name: "mecklenburg-vorpommern", url: "https://download.geofabrik.de/europe/germany/mecklenburg-vorpommern-latest.osm.pbf" }
          - { name: "niedersachsen", label: "Niedersachsen (incl. Bremen)", url: "https://download.geofabrik.de/europe/germany/niedersachsen-latest.osm.pbf" }
          - { name: "nordrhein-westfalen", url: "https://download.geofabrik.de/europe/germany/nordrhein-westfalen-latest.osm.pbf" }
          - { name: "rheinland-pfalz", url: "https://download.geofabrik.de/europe/germany/rheinland-pfalz-latest.osm.pbf" }
          - { name: "saarland", url: "https://download.geofabrik.de/europe/germany/saarland-latest.osm.pbf" }
          - { name: "sachsen", url: "https://download.geofabrik.de/europe/germany/sachsen-latest.osm.pbf" }
          - { name: "sachsen-anhalt", url: "https://download.geofabrik.de/europe/germany/sachsen-anhalt-latest.osm.pbf" }
          - { name: "schleswig-holstein", url: "https://download.geofabrik.de/europe/germany/schleswig-holstein-latest.osm.pbf" }
          - { name: "thueringen", url: "https://download.geofabrik.de/europe/germany/thueringen-latest.osm.pbf" }
          - { name: "netherlands", url: "https://download.geofabrik.de/europe/netherlands-latest.osm.pbf" }
          - { name: "belgium", url: "https://download.geofabrik.de/europe/belgium-latest.osm.pbf" }
          - { name: "luxembourg", url: "https://download.geofabrik.de/europe/luxembourg-latest.osm.pbf" }
          - { name: "ile-de-france", url: "https://download.geofabrik.de/europe/france/ile-de-france-latest.osm.pbf" }
          # Geofabrik has no per-regione Italian extracts; nord-ovest is the
          # smallest extract covering Lombardy (also includes Piedmont,
          # Liguria, Aosta Valley).
          - { name: "italy-nord-ovest", label: "Nord-Ovest (incl. Lombardy)", url: "https://download.geofabrik.de/europe/italy/nord-ovest-latest.osm.pbf" }
    steps:

    - name: Checkout repository (for admin overlay)
      uses: actions/checkout@v4

    - name: Download Dependencies
      run: apt install wget -y

    - name: Download OSM PBF for ${{ matrix.region.name }}
      run: |
        echo "Downloading ${{ matrix.region.name }} PBF file..."
        pbf=$(basename "${{ matrix.region.url }}")
        wget -q -O "$pbf" "${{ matrix.region.url }}"
        echo "Download completed for ${{ matrix.region.name }}"
        ls -la *.osm.pbf

    - name: Fetch community default_speeds.json
      run: wget -q https://raw.githubusercontent.com/OpenStreetMapSpeeds/schema/master/default_speeds.json

    - name: Mjolnir Build for ${{ matrix.region.name }}
      run: |
        echo "Building Valhalla configuration for ${{ matrix.region.name }}..."
        valhalla_build_config \
          --mjolnir-include-bicycle false \
          --mjolnir-include-pedestrian false \
          --mjolnir-default-speeds-config $(pwd)/default_speeds.json \
          | tee valhalla.json

        # Bake a per-node timezone so date_time routing can evaluate
        # time-conditional restrictions. Each regional extract is a single IANA
        # zone, so a one-polygon tz_world covering West Europe (tagged with this
        # region's zone) is enough — no need for the full timezone-boundary DB.
        case "${{ matrix.region.name }}" in
          netherlands)   TZID="Europe/Amsterdam" ;;
          belgium)       TZID="Europe/Brussels" ;;
          luxembourg)    TZID="Europe/Luxembourg" ;;
          ile-de-france) TZID="Europe/Paris" ;;
          italy-*)       TZID="Europe/Rome" ;;
          *)             TZID="Europe/Berlin" ;;
        esac
        echo "Timezone for ${{ matrix.region.name }}: $TZID"
        tz_sqlite="$(pwd)/timezones.sqlite"
        rm -f "$tz_sqlite"
        spatialite "$tz_sqlite" "CREATE TABLE tz_world (id INTEGER PRIMARY KEY AUTOINCREMENT, TZID TEXT);
        SELECT AddGeometryColumn('tz_world','geom',4326,'MULTIPOLYGON',2);
        INSERT INTO tz_world (TZID, geom) VALUES ('$TZID', CastToMulti(GeomFromText('POLYGON((-12 34,-12 60,30 60,30 34,-12 34))',4326)));
        SELECT CreateSpatialIndex('tz_world','geom');"
        test "$(spatialite "$tz_sqlite" 'SELECT count(*) FROM tz_world;')" = "1" || { echo "ERROR: tz overlay build failed"; exit 1; }
        python3 -c "import json; c=json.load(open('valhalla.json')); c['mjolnir']['timezone']='$tz_sqlite'; json.dump(c, open('valhalla.json','w'), indent=2)"
        grep -q '"timezone": ".*timezones.sqlite"' valhalla.json || { echo "ERROR: timezone not injected into config"; exit 1; }

        pbf=$(basename "${{ matrix.region.url }}")
        mkdir -p /data/valhalla

        echo "Building admin DB from overlay + regional PBF..."
        valhalla_build_admins -c valhalla.json \
          admin-overlays/west-europe.osm.pbf \
          "$pbf"

        echo "Building tiles for ${{ matrix.region.name }}..."
        valhalla_build_tiles -c valhalla.json "$pbf"

        echo "Applying OpenStreetMapSpeeds default speeds to tiles..."
        valhalla_assign_speeds -c valhalla.json

        echo "Building extract for ${{ matrix.region.name }}..."
        valhalla_build_extract -c valhalla.json

        echo "Creating tarball for ${{ matrix.region.name }}..."
        mv /data/valhalla/tiles.tar /data/valhalla/valhalla_tiles_${{ matrix.region.name }}.tar

        echo "Tile generation completed for ${{ matrix.region.name }}"
        ls -la /data/valhalla/

    - name: Copy and Fix Permissions for ${{ matrix.region.name }}
      run: |
        mkdir -p /tmp/artifacts
        cp /data/valhalla/valhalla_tiles_${{ matrix.region.name }}.tar /tmp/artifacts/
        chown $(whoami):$(whoami) /tmp/artifacts/valhalla_tiles_${{ matrix.region.name }}.tar
        chmod 666 /tmp/artifacts/valhalla_tiles_${{ matrix.region.name }}.tar
        ls -la /tmp/artifacts/

    - name: Upload Build Artifact for ${{ matrix.region.name }}
      uses: actions/upload-artifact@v7
      with:
        name: valhalla_tiles_${{ matrix.region.name }}
        path: /tmp/artifacts/valhalla_tiles_${{ matrix.region.name }}.tar

  # Build xdelta3 deltas (.vtiledelta) of each region's fresh tiles against
  # the same region's asset in the previous monthly version-tag release
  # (e.g. 2026-06). Embedded devices can then download a small delta instead
  # of the full tile tarball. Regions without a previous asset (new regions,
  # or no previous version tag yet) are skipped gracefully.
  delta:
    needs: [generate_tiles]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region:
          - "baden-wuerttemberg"
          - "bayern"
          - "berlin_brandenburg"
          - "bremen"
          - "hamburg"
          - "hessen"
          - "mecklenburg-vorpommern"
          - "niedersachsen"
          - "nordrhein-westfalen"
          - "rheinland-pfalz"
          - "saarland"
          - "sachsen"
          - "sachsen-anhalt"
          - "schleswig-holstein"
          - "thueringen"
          - "netherlands"
          - "belgium"
          - "luxembourg"
          - "ile-de-france"
          - "italy-nord-ovest"
    steps:
      - name: Checkout repository (for tools/create-tile-delta.sh)
        uses: actions/checkout@v4

      - name: Install delta tooling
        run: sudo apt-get install -y xdelta3 jq

      - name: Download tile artifact for ${{ matrix.region }}
        uses: actions/download-artifact@v4
        with:
          name: valhalla_tiles_${{ matrix.region }}

      - name: Determine previous version tag
        id: prev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUR=$(date +%Y-%m)
          echo "cur=$CUR" >> "$GITHUB_OUTPUT"
          # Version tags look like YYYY-MM; string comparison sorts them
          # correctly. Take the newest tag strictly older than this month.
          PREV=$(gh api repos/${{ github.repository }}/tags --jq '.[].name' \
            | grep -E '^[0-9]{4}-[0-9]{2}$' \
            | sort -r \
            | awk -v cur="$CUR" '$0 < cur' \
            | head -n1 || true)
          if [[ -z "$PREV" ]]; then
            echo "::notice::No version tag older than $CUR found; skipping delta for ${{ matrix.region }}"
            echo "made=false" >> "$GITHUB_OUTPUT"
          else
            echo "Previous version tag: $PREV (current: $CUR)"
            echo "prev=$PREV" >> "$GITHUB_OUTPUT"
            echo "made=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download base asset from previous release
        id: base
        if: steps.prev.outputs.made == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p base
          if gh release download "${{ steps.prev.outputs.prev }}" \
              --pattern "valhalla_tiles_${{ matrix.region }}.tar" \
              --dir base/; then
            echo "made=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Asset valhalla_tiles_${{ matrix.region }}.tar not found in release ${{ steps.prev.outputs.prev }} (new region?); skipping delta"
            echo "made=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create delta for ${{ matrix.region }}
        id: delta
        if: steps.prev.outputs.made == 'true' && steps.base.outputs.made == 'true'
        run: |
          PREV="${{ steps.prev.outputs.prev }}"
          CUR="${{ steps.prev.outputs.cur }}"
          tools/create-tile-delta.sh \
            "base/valhalla_tiles_${{ matrix.region }}.tar" \
            "valhalla_tiles_${{ matrix.region }}.tar" \
            "$PREV" "$CUR" \
            "valhalla_tiles_${{ matrix.region }}_${PREV}_to_${CUR}.vtiledelta"
          echo "made=true" >> "$GITHUB_OUTPUT"

      - name: Upload delta artifact for ${{ matrix.region }}
        if: steps.delta.outputs.made == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: vtiledelta_${{ matrix.region }}
          path: valhalla_tiles_${{ matrix.region }}_${{ steps.prev.outputs.prev }}_to_${{ steps.prev.outputs.cur }}.vtiledelta

  release:
    needs: [generate_tiles, delta]
    runs-on: ubuntu-latest
    # Only publish to the `latest` release from main. Workflow runs on feature
    # branches still produce artifacts (downloadable from the workflow run UI)
    # but must not overwrite the production release.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download tile artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: valhalla_tiles_*

      - name: Download delta artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: vtiledelta_*

      - name: List All Artifacts
        run: |
          echo "Listing all downloaded artifacts:"
          find artifacts -type f \( -name "*.tar" -o -name "*.vtiledelta" \)

      - name: Create Automatic Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: "Valhalla Tiles - Germany + Benelux + France + Italy"
          prerelease: false
          make_latest: true
          files: |
            artifacts/**/*.tar
            artifacts/**/*.vtiledelta

      - name: Compute version for versioned release
        id: version
        run: |
          echo "ver=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "month=$(date '+%B %Y')" >> "$GITHUB_OUTPUT"

      - name: Create versioned release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.ver }}
          name: "Valhalla Tiles - ${{ steps.version.outputs.month }}"
          body: "Versioned snapshot for delta updates. Deltas are relative to the previous version tag."
          prerelease: false
          # The rolling `latest` tag must keep GitHub's Latest badge.
          make_latest: false
          # Same-month re-runs: the action updates the existing release and
          # overwrites same-named assets by default.
          files: |
            artifacts/**/*.tar
            artifacts/**/*.vtiledelta

      - name: Generate app token for downloads rebuild
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: librescoot
          repositories: downloads.librescoot.org

      - name: Trigger downloads site rebuild
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: librescoot/downloads.librescoot.org
          event-type: releases-changed
